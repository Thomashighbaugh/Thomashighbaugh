name: Generate README

on:
  workflow_dispatch: # Run workflow via GitHub website
  schedule:
    # Run this workflow everyday at 00:01 UTC
    - cron: '1 0 */1 * *'
  push:
    branches:
      - main

concurrency:
  group: readme-generate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate README with vice
        run: pnpm run build:readme
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: Thomashighbaugh

      - name: Commit and push if changed
        run: |-
          git config --global user.email "readme-bot@github.com"
          git config --global user.name "README-bot"
          git add README.md .github/assets
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "docs: regenerate profile README ($(date +%Y-%m-%d))"
          git push origin HEAD:${{ github.ref_name }}
